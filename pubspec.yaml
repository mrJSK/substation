name: suberp
description: "SubERP — Power Utility Operations & Maintenance ERP"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # ── Backend ──────────────────────────────────────────────────────────────
  supabase_flutter: ^2.9.0         # Auth, Database, Realtime, Storage

  # ── State Management ─────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1         # Best-in-class reactive state management
  riverpod_annotation: ^2.6.1

  # ── Navigation ───────────────────────────────────────────────────────────
  go_router: ^14.8.1               # Declarative routing with shell routes (launchpad)

  # ── Data & Serialization ─────────────────────────────────────────────────
  freezed_annotation: ^3.0.0       # Immutable models with copyWith
  json_annotation: ^4.9.0

  # ── UI ───────────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  gap: ^3.0.1                      # SizedBox shorthand for spacing

  # ── Forms ────────────────────────────────────────────────────────────────
  reactive_forms: ^17.0.1          # Typed reactive form engine (dynamic forms)

  # ── Utilities ────────────────────────────────────────────────────────────
  intl: ^0.20.1                    # Date/number formatting (24-hr, Indian locale)
  collection: ^1.19.1              # List/Map utilities
  equatable: ^2.0.7                # Value equality for models
  uuid: ^4.5.1                     # UUID generation for local IDs

  # ── Connectivity / Offline ───────────────────────────────────────────────
  connectivity_plus: ^6.1.4        # Detect network state (offline mode)

  # ── Offline / Local Storage ──────────────────────────────────────────────
  hive_ce: ^2.10.1                 # Fast key-value store — cache equipment, org units per shift
  hive_ce_flutter: ^2.4.0          # Flutter init helper
  drift: ^2.26.1                   # SQLite ORM — queue pending logsheet writes offline
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.31
  shared_preferences: ^2.3.5       # Light preferences (theme, last substation)

  # ── PDF / Reports ────────────────────────────────────────────────────────
  pdf: ^3.11.3                     # Generate statutory register PDFs
  printing: ^5.14.2                # Print / share PDFs (mobile + desktop + web)

  # ── File / Storage ───────────────────────────────────────────────────────
  file_picker: ^6.2.1              # Upload documents, drawings

  # ── Charts ───────────────────────────────────────────────────────────────
  fl_chart: ^0.70.2                # SAIDI/SAIFI trends, transformer load graphs

  # ── Platform ─────────────────────────────────────────────────────────────
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.9.3
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.1
  drift_dev: ^2.26.1
  hive_ce_generator: ^1.7.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
